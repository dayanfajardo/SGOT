{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}SGOT{% endblock %}</title>
    <script>
        (function () {
            var key = "sgot-theme";
            var saved = null;
            try {
                saved = window.localStorage.getItem(key);
            } catch (error) {}
            var theme;
            if (saved === "light" || saved === "classic-dark") {
                theme = saved;
            } else if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) {
                theme = "classic-dark";
            } else {
                theme = "light";
            }
            document.documentElement.setAttribute("data-theme", theme);
        })();
    </script>
    <link rel="preconnect" href="https://rsms.me/" crossorigin>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/sgot.css' %}">
</head>
<body>
    <div class="sgot-app">
        <aside class="sgot-sidebar">
            <div class="sgot-brand">SGOT</div>
            <nav class="sgot-nav" aria-label="Principal">
                <span class="sgot-nav-item is-disabled">Dashboard</span>
                <a class="sgot-nav-item{% if request.resolver_match.url_name == 'workorder_list' %} is-active{% endif %}" href="{% url 'workorders:workorder_list' %}">Órdenes de trabajo</a>
                <span class="sgot-nav-item is-disabled">Clientes</span>
                <span class="sgot-nav-item is-disabled">Almacén</span>
                <span class="sgot-nav-item is-disabled">Catálogo</span>
            </nav>
        </aside>

        <div class="sgot-shell">
            <div class="sgot-shell-inner">
                <header class="sgot-topbar">
                    <div class="sgot-topbar-actions">
                        <button type="button" class="sgot-theme-toggle" id="sgot-theme-toggle" aria-label="Cambiar tema" title="Cambiar tema">
                            <svg class="sgot-theme-icon sgot-theme-icon-moon" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                                <path d="M13.2 10.1A5.6 5.6 0 0 1 5.9 2.8 4.4 4.4 0 1 0 13.2 10.1Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
                            </svg>
                            <svg class="sgot-theme-icon sgot-theme-icon-sun" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                                <circle cx="8" cy="8" r="2.6" stroke="currentColor" stroke-width="1.5"/>
                                <path d="M8 2v1.2M8 12.8V14M2 8h1.2M12.8 8H14M3.7 3.7l.9.9M11.4 11.4l.9.9M3.7 12.3l.9-.9M11.4 4.6l.9-.9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                            </svg>
                        </button>
                        <span class="sgot-user">{{ request.user }}</span>
                        <form class="sgot-topbar-logout" method="post" action="{% url 'accounts:logout' %}">
                            {% csrf_token %}
                            <button type="submit" class="sgot-btn sgot-btn-quiet">Cerrar sesión</button>
                        </form>
                    </div>
                </header>

                <main class="sgot-main">
                    {% if messages %}
                    <div class="sgot-messages">
                        {% for message in messages %}
                        <div class="sgot-message sgot-message-{{ message.level_tag }}" role="alert">{{ message }}</div>
                        {% endfor %}
                    </div>
                    {% endif %}
                    {% block content %}{% endblock %}
                </main>
            </div>
        </div>
    </div>
    <script src="{% static 'js/theme.js' %}"></script>
</body>
</html>
