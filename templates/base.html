{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}SGOT{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/sgot.css' %}">
</head>
<body>
    <div class="sgot-app">
        <aside class="sgot-sidebar">
            <div class="sgot-brand">SGOT</div>
            <nav class="sgot-nav" aria-label="Principal">
                <span class="sgot-nav-item is-disabled">Dashboard</span>
                <a class="sgot-nav-item{% if request.resolver_match.url_name == 'workorder_list' %} is-active{% endif %}" href="{% url 'workorders:workorder_list' %}">Órdenes de trabajo</a>
                <span class="sgot-nav-item is-disabled">Clientes</span>
                <span class="sgot-nav-item is-disabled">Almacén</span>
                <span class="sgot-nav-item is-disabled">Catálogo</span>
            </nav>
        </aside>

        <div class="sgot-shell">
            <header class="sgot-topbar">
                <span class="sgot-user">{{ request.user }}</span>
                <form method="post" action="{% url 'accounts:logout' %}">
                    {% csrf_token %}
                    <button type="submit" class="sgot-btn">Cerrar sesión</button>
                </form>
            </header>

            <main class="sgot-main">
                {% block content %}{% endblock %}
            </main>
        </div>
    </div>
</body>
</html>
